apiVersion: apps/v1
kind: deployment
metadata:
  name: alert-notifier-deployment
  namespace: incident
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-notifier
  template:
    metadata:
      labels:
        app: alert-notifier
    spec:
      containers:
        - name: alert-notifier
          image: alert-notifier:latest
          ports:
            - containerPort: 8080
