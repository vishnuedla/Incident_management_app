apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-notifier-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-notifier
  template:
    metadata:
      labels:
        app: alert-notifier
    spec:
      containers:
        - name: alert-notifier
          image: vishnu4538/alert_worker:v5
          ports:
            - containerPort: 8080
